name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clinical-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate specification and independent reference vectors
        run: python tools/verify.py
      - name: Compile Android domain with all Java warnings as errors
        run: |
          mkdir -p .build/java
          javac -Xlint:all -Werror -d .build/java android/core/src/main/java/org/sicdic/core/*.java android/core/src/test/java/org/sicdic/core/VectorRunner.java
          java -cp .build/java org.sicdic.core.VectorRunner shared-test-vectors/generated/vectors.tsv .build/java-results.tsv
      - name: Run Windows domain golden vectors
        run: dotnet run --project windows/SicDic.Core.Tests -c Release -- shared-test-vectors/generated/vectors.tsv .build/dotnet-results.tsv
      - name: Require byte-identical native results
        run: diff -u .build/java-results.tsv .build/dotnet-results.tsv
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Native Android lint, golden tests and builds
        working-directory: android
        run: gradle --no-daemon :core:check :app:lint :app:assembleDebug :app:assembleRelease
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native WPF with warnings as errors
        run: dotnet build windows/SicDic.App -c Release
      - name: Execute same clinical golden tests on Windows
        run: dotnet run --project windows/SicDic.Core.Tests -c Release -- shared-test-vectors/generated/vectors.tsv
  quality-gate:
    if: always()
    needs: [clinical-parity, android, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all build and parity gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; assert all(v["result"] == "success" for v in json.loads(os.environ["RESULTS"]).values())'
