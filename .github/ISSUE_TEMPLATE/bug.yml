name: Software or clinical calculation defect
description: Report a reproducible defect using synthetic data only
body:
  - type: markdown
    attributes:
      value: Do not include patient data, identifiers, clinical screenshots, secrets or credentials. Use SECURITY.md for private vulnerability reporting.
  - type: textarea
    id: version
    attributes:
      label: App version, ruleset and platform
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic inputs and steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual result, with source if clinical
    validations:
      required: true
